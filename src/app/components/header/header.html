<header class="header">
  <div class="header__container container">
    <a routerLink="/" class="header__logo" (click)="closeMenu()">
      <div class="header__logo-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M12 2L2 7V17L12 22L22 17V7L12 2Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M12 22V12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 7L12 12L2 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M2 17L12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M22 17L12 12" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <span class="header__logo-text">AES<span class="text-gradient">Explorer</span></span>
    </a>

    <nav class="header__nav" [class.header__nav--open]="mobileMenuOpen()">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="header__nav-link--active"
          [routerLinkActiveOptions]="{ exact: item.exact }"
          class="header__nav-link"
          (click)="closeMenu()"
        >
          {{ item.label }}
        </a>
      }
    </nav>

    <button class="header__menu-btn" (click)="toggleMenu()" [attr.aria-expanded]="mobileMenuOpen()">
      <span class="header__menu-icon" [class.header__menu-icon--open]="mobileMenuOpen()">
        <span></span>
        <span></span>
        <span></span>
      </span>
    </button>
  </div>
</header>
